name: Sync to Voyra

# 鏈粨搴?push 鍚庯紝鎶?鎻愮ず璇嶅簱 浠ｇ爜鑷姩鍚屾杩?Voyra 涓讳粨搴撳苟瑙﹀彂閮ㄧ讲
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout voyra-prompt-library
        uses: actions/checkout@v4

      - name: Checkout Voyra main repo
        uses: actions/checkout@v4
        with:
          repository: liixnglinb/Voyra
          token: ${{ secrets.VOYRA_SYNC_TOKEN }}
          path: voyra

      - name: Sync files
        run: |
          cp "src\pages\PromptLibrary.jsx" "voyra/src\pages\PromptLibrary.jsx"
          cp "src\data\prompt-presets.js" "voyra/src\data\prompt-presets.js"

      - name: Commit & push to Voyra
        run: |
          cd voyra
          git config user.name "voyra-prompt-library-sync[bot]"
          git config user.email "liixnglinb@users.noreply.github.com"
          git add voyra/src/pages/PromptLibrary.jsx voyra/src/data/prompt-presets.js
          if git diff --cached --quiet; then
            echo "鏃犱唬鐮佸彉鏇达紝璺宠繃鎻愪氦"
            exit 0
          fi
          git commit -m "chore(voyra-prompt-library): 鑷姩鍚屾鑷?voyra-prompt-library ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
